# INERT until walkthrough 08 step K moves it to platform/observability/ (and enables the Grafana
# ingress in charts/platform-ingresses/values.yaml) in ONE pull request.
#
# The settings of Grafana's "Sign in with GitHub": client id, client secret and the public address
# of Grafana. They come from AWS Secrets Manager (gatepass/dev/app/grafana-oauth, a JSON with
# client_id, client_secret and root_url, created by the person who made the GitHub OAuth app) and
# become environment variables of the Grafana pod (platform/grafana/values.yaml lists this Secret
# in envFromSecrets, optional: Grafana still starts without it). Grafana reads GF_* variables over
# its ini file, so GF_AUTH_GITHUB_ENABLED=true here is what switches the login on; the ini in Git
# keeps it off. root_url is the public address, which contains the domain, hence not in Git.
#
# Why it is NOT already in platform/observability/externalsecrets.yaml: with the Secrets Manager
# entry missing the ExternalSecret reports an error and observability-config shows Degraded, which
# holds back the sync waves after it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target:
    name: grafana-oauth
    template:
      data:
        GF_AUTH_GITHUB_ENABLED: "true"
        GF_AUTH_GITHUB_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GITHUB_CLIENT_SECRET: "{{ .client_secret }}"
        GF_SERVER_ROOT_URL: "{{ .root_url }}"
  data:
    - {secretKey: client_id, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: client_id}}
    - {secretKey: client_secret, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: client_secret}}
    - {secretKey: root_url, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: root_url}}
