# The External Secrets proof: "make a Kubernetes Secret called smoke-secret whose key `greeting`
# holds the value of the AWS secret gatepass/dev/app/smoke". The file names the secret, never its
# value, so it is safe in a public repository.
#
# The AWS secret is created by hand BEFORE this application is activated (walkthrough 04b, step
# F) with a harmless text. If it does not exist the operator reports `SecretSyncedError` on this
# object and the Application turns Degraded: that is the failure you would see in real life
# for a missing secret.
#
#   secretStoreRef   the ClusterSecretStore from platform/cluster-config/secretstore-aws.yaml
#   refreshInterval  re-read every hour: change the value in AWS and the Secret follows, no
#                    redeploy. (Pods that load it as an environment variable still need a
#                    restart; one that mounts it as a file sees the change.)
#   creationPolicy Owner  the operator owns the Secret: deleting this object deletes the Secret
#
# The IAM role of the operator can read only gatepass/dev/app/*, so a request for any other
# name fails with AccessDenied: try it as a check (walkthrough 04b section 7).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: smoke-secret
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        key: gatepass/dev/app/smoke
