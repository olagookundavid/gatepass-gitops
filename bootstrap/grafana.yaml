# Child application: grafana (grafana 14.4.0 from https://grafana-community.github.io/helm-charts).
# Chart version pinned; settings in platform/grafana/values.yaml; wave 3 (after observability-config
# at wave 1, which creates the namespaces and the Secrets this reads). See that values file for
# what it does and what is unverified.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.4.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/platform/grafana/values.yaml
    - repoURL: git@github.com:olagookundavid/gatepass-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
