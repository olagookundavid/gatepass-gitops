# Child application: the External Secrets Operator (ESO), sync-wave -1.
#
# What it does: reads secrets from AWS Secrets Manager and writes them as ordinary Kubernetes
# Secrets, according to ExternalSecret objects that live in Git (they name the secret, never
# its value). The AWS side is gatepass-infra/30-platform-aws/external-secrets.tf (a role that
# can read only gatepass/dev/app/*); the connection to AWS is the ClusterSecretStore in
# platform/cluster-config/secretstore-aws.yaml.
#
# NAMESPACE external-secrets is created by this application (CreateNamespace=true) and labelled
# for Pod Security: `baseline` is enforced, `restricted` only warns. The controller pods meet
# `restricted` in practice; if a pod is ever rejected, the warning in the sync output says why.
#
# SERVER-SIDE APPLY: ESO's CRDs are very large (see karpenter-crd.yaml for the reason).
#
# Related: platform/external-secrets/values.yaml, projects/platform.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: git@github.com:olagookundavid/gatepass-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
