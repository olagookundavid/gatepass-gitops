# Child application: otel-metrics (opentelemetry-collector 0.178.2 from https://open-telemetry.github.io/opentelemetry-helm-charts).
# Chart version pinned; settings in platform/otel-metrics/values.yaml; wave 3 (after observability-config
# at wave 1, which creates the namespaces and the Secrets this reads). See that values file for
# what it does and what is unverified.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.2
      helm:
        releaseName: otel-metrics
        valueFiles:
          - $values/platform/otel-metrics/values.yaml
    - repoURL: git@github.com:olagookundavid/gatepass-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
