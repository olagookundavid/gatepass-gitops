{{- /*
Secret values live in AWS Secrets Manager, never in Git. This asks the External Secrets
Operator to copy them into a Kubernetes Secret named <release>-secrets, which the Deployment
loads as environment variables. Wave -3: the Secret exists before anything that uses it.
*/ -}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gps.fullname" . }}
  labels: {{- include "gps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.externalSecret.storeName }}}
  target: {name: {{ include "gps.fullname" . }}-secrets}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .key }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
