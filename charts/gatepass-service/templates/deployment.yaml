{{- /*
The workload as a plain Deployment (the default). When `rollout.enabled` the SAME pod template is run by
an Argo Rollouts Rollout instead (templates/rollout.yaml) and this file renders nothing. The pod template
and the reasons for each setting are in templates/_helpers.tpl (gps.podTemplate).
Rollout behaviour that is not in the pod: replicas are NOT written when an autoscaler owns them
(otherwise Argo CD and the autoscaler fight); maxUnavailable 0 and maxSurge 1: a rollout never removes a
ready pod before its replacement is ready.
*/ -}}
{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gps.fullname" . }}
  labels: {{- include "gps.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # A rollout that cannot become ready is reported failed (Argo CD: Degraded, then the alerts) after
  # this long. The Kubernetes default is 600 s; 180 s is enough for a Go service (found 2026-11-07:
  # the first broken release took the full 10 minutes to be flagged). Written for every service, also
  # with an autoscaler (before 2026-11-11 it sat inside the replicas condition and vanished with HPA).
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "gps.selectorLabels" . | nindent 6 }}
  template: {{- include "gps.podTemplate" . | nindent 4 }}
{{- end }}
