{{- /*
Secrets that the service reads as FILES (values key secretFiles). Same mechanism as
externalsecret.yaml (External Secrets copies from Secrets Manager, wave -3, Git never holds a value),
but the target Secret is named <release>-files and the Deployment mounts it as a volume instead of
loading it into the environment. Each row becomes one file named after `fileName`.
Without `property` the whole secret string is the file content (a plain random key); with
`property` it is one field of a JSON secret.
Why separate from <release>-secrets: that Secret is loaded with envFrom into EVERY process
environment; a signing key must never end up there.
*/ -}}
{{- if .Values.secretFiles.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gps.fullname" . }}-files
  labels: {{- include "gps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.externalSecret.storeName }}}
  target: {name: {{ include "gps.fullname" . }}-files}
  data:
    {{- range .Values.secretFiles.data }}
    - secretKey: {{ .fileName }}
      remoteRef:
        key: {{ .key }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
