{{- /*
One ServiceAccount per service (not `default`), so an AWS role can be bound to exactly this
service by EKS Pod Identity (an association names namespace + service account). Wave -2: it
exists before the migration Job (wave -1) and the Deployment (wave 0).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gps.serviceAccountName" . }}
  labels: {{- include "gps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- /*
The migration Job may run as its OWN service account (migration.serviceAccountName, for example
catalog-migrate): the migrate role can create tables, the service role must not, so they are two
AWS roles bound by Pod Identity to two service accounts (gatepass-infra/50-workloads/roles.tf).
Created here, with the same wave, only when it differs from the service's own account.
*/ -}}
{{- if and .Values.migration.enabled .Values.migration.serviceAccountName (ne .Values.migration.serviceAccountName (include "gps.serviceAccountName" .)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccountName }}
  labels: {{- include "gps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
{{- end }}
