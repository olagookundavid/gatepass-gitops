# GATEWAY collector: the one address every service sends its telemetry to (OTLP on 4317 gRPC and
# 4318 HTTP). It is a Deployment (2 replicas), so it can be scaled and restarted without losing
# a node's worth of anything, and it is the single place that:
#   * drops noise     health-check spans (livez / readyz) never reach X-Ray
#   * protects itself memory_limiter refuses data before the pod is OOM-killed, batch groups sends
#   * adds context    which namespace, pod, node and deployment the data came from (k8sattributes)
#   * translates      traces -> AWS X-Ray, metrics -> the Prometheus workspace (SigV4, signed with
#                     the pod's IAM role through Pod Identity; no keys)
# Services never talk to AWS themselves: change the destination here, not in 7 services.
#
# IMAGE: the "contrib" distribution (it contains the AWS exporters), pinned BY DIGEST.
# UNVERIFIED until the first run: that every component named below is in this image's build
# (the collector refuses to start and names the missing one); how the health-span filter
# matches (the attribute names differ between OpenTelemetry semantic-convention versions, so the
# filter lists three); the metric names that reach the workspace (rules/services.yaml assumes
# http_server_request_duration_seconds_*).
#
# Related: bootstrap/otel-gateway.yaml (the chart and version), platform/otel-metrics and
# platform/otel-agent (the other two collectors), gatepass-infra/60-observability (the IAM role
# of service account otel-collector and the workspace).
mode: deployment
replicaCount: 2

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: ""
  digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
command:
  name: otelcol-contrib

# The same service account in all three collectors: one write-only IAM role (Pod Identity).
serviceAccount:
  create: true
  name: otel-collector

presets:
  kubernetesAttributes:
    enabled: true   # adds the k8sattributes processor and the RBAC it needs

extraEnvsFrom:
  - secretRef:
      name: observability-endpoints   # AMP_REMOTE_WRITE_URL ... (copied by External Secrets)

ports:
  otlp: {enabled: true}
  otlp-http: {enabled: true}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}

resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 384Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    sigv4auth:
      region: us-east-1
      service: aps
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    jaeger: null
    prometheus: null
    zipkin: null
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    # Health-check spans (the load balancer and kubelet probe every few seconds) would be most
    # of the traces and carry no information. Three attribute names because the SDK may use the
    # old (http.target, http.route) or the new (url.path) convention.
    filter/healthchecks:
      error_mode: ignore
      traces:
        span:
          - 'IsMatch(attributes["url.path"], ".*/(livez|readyz)$")'
          - 'IsMatch(attributes["http.target"], ".*/(livez|readyz)$")'
          - 'IsMatch(attributes["http.route"], ".*/(livez|readyz)$")'
    batch: {}
  exporters:
    debug: null
    awsxray:
      region: us-east-1
    prometheusremotewrite:
      endpoint: ${env:AMP_REMOTE_WRITE_URL}
      auth:
        authenticator: sigv4auth
      # Promote resource attributes (service.name, k8s.namespace.name ...) to metric labels, so
      # PromQL can say service_name="catalog". Cardinality note: this also promotes pod names;
      # production allow-lists the few that are needed.
      resource_to_telemetry_conversion:
        enabled: true
  service:
    extensions: [health_check, sigv4auth]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/healthchecks, batch]   # the preset inserts k8s_attributes
        exporters: [awsxray]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]   # the preset inserts k8s_attributes
        exporters: [prometheusremotewrite]
      logs: null
