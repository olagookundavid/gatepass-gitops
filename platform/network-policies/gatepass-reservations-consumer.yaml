# Network policies of the namespace gatepass-reservations-consumer: reservations inventory consumer (SQS, DynamoDB; no listener exposed).
#
# Same model as gatepass-skeleton.yaml (read its header first): default deny, then exactly the
# paths this service needs. They live in the platform repository path and not in the service's
# chart because the `apps` project may not create NetworkPolicy objects: a bad pull request to a
# service must not be able to open the door for itself.
#
# OPEN HERE:
#   NO ingress except the same-namespace smoke test; egress DNS, OTLP, Pod Identity agent, HTTPS to AWS.
#   It polls SQS (outbound), so nothing needs to reach it. No Valkey: the rate limiter is the API's.
# NOT open: the internet except HTTPS, other namespaces, the data subnets except the port above.
# kubelet probes come from the node and need no rule. Related: cluster-config/namespace-gatepass-reservations-consumer.yaml,
# apps/reservations-consumer/values.yaml, walkthrough 10.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gatepass-reservations-consumer
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gatepass-reservations-consumer
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-egress
  namespace: gatepass-reservations-consumer
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-egress
  namespace: gatepass-reservations-consumer
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # The Pod Identity agent on the node hands out the role credentials.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # AWS APIs and the public Cognito key set: HTTPS to anywhere EXCEPT the VPC itself, so this rule
    # cannot be used to reach other pods or the data subnets.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-http
  namespace: gatepass-reservations-consumer
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
