# Network policies of the namespace gatepass-notifications: the notifications API (a user's notifications and ticket download links; DynamoDB, S3 presign).
#
# Same model as gatepass-catalog.yaml and gatepass-reservations.yaml (read gatepass-skeleton.yaml first):
# default deny, then exactly the paths this service needs. They live in the platform repository path
# and not in the service's chart because the `apps` project may not create NetworkPolicy objects: a bad
# pull request to a service must not be able to open the door for itself.
#
# OPEN HERE:
#   ingress 8080 from the ALB subnets; egress DNS, OTLP, Pod Identity agent, HTTPS to AWS (DynamoDB
#   and S3 go through the gateway endpoints, Cognito keys over the NAT).
# NOT open: the internet except HTTPS, other namespaces, the data subnets except the ports above.
# kubelet probes come from the node and need no rule. Related: cluster-config/namespace-gatepass-notifications.yaml,
# apps/notifications/values.yaml, walkthrough 11.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gatepass-notifications
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gatepass-notifications
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-egress
  namespace: gatepass-notifications
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-egress
  namespace: gatepass-notifications
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # The Pod Identity agent on the node hands out the role credentials.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # AWS APIs (and Cognito's public key set): HTTPS to anywhere EXCEPT the VPC itself, so this rule
    # cannot be used to reach other pods or the data subnets.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-http
  namespace: gatepass-notifications
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-ingress
  namespace: gatepass-notifications
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: notifications}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.20.0.0/24}
        - ipBlock: {cidr: 10.20.1.0/24}
        - ipBlock: {cidr: 10.20.2.0/24}
      ports:
        - {protocol: TCP, port: 8080}
