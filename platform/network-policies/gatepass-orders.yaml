# Network policies of the namespace gatepass-orders: the public orders API (creates orders from holds; calls the reservations private API, PostgreSQL, SQS, Secrets Manager).
#
# Same model as gatepass-catalog.yaml and gatepass-reservations.yaml (read gatepass-skeleton.yaml first):
# default deny, then exactly the paths this service needs. They live in the platform repository path
# and not in the service's chart because the `apps` project may not create NetworkPolicy objects: a bad
# pull request to a service must not be able to open the door for itself.
#
# OPEN HERE:
#   ingress 8080 from the ALB subnets; egress DNS, OTLP, Pod Identity agent, HTTPS to AWS (SQS, Secrets
#   Manager, Cognito keys), 5432 to the data subnets (PostgreSQL), 8081 to the reservations pods (the
#   private API that turns a hold into tickets).
# NOT open: the internet except HTTPS, other namespaces, the data subnets except the ports above.
# kubelet probes come from the node and need no rule. Related: cluster-config/namespace-gatepass-orders.yaml,
# apps/orders/values.yaml, walkthrough 11.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-egress
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-egress
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # The Pod Identity agent on the node hands out the role credentials.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # AWS APIs (and Cognito's public key set): HTTPS to anywhere EXCEPT the VPC itself, so this rule
    # cannot be used to reach other pods or the data subnets.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-http
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-ingress
  namespace: gatepass-orders
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: orders}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.20.0.0/24}
        - ipBlock: {cidr: 10.20.1.0/24}
        - ipBlock: {cidr: 10.20.2.0/24}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.20.100.0/24}
        - ipBlock: {cidr: 10.20.101.0/24}
        - ipBlock: {cidr: 10.20.102.0/24}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reservations-internal-egress
  namespace: gatepass-orders
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # The reservations PRIVATE API (8081), pods of the reservations application only. Both selectors in
    # one rule: namespace AND pod label must match. The other half of this door is
    # allow-internal-api-from-orders in gatepass-reservations.yaml (both must be open).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gatepass-reservations}
          podSelector:
            matchLabels: {app.kubernetes.io/name: reservations}
      ports:
        - {protocol: TCP, port: 8081}
