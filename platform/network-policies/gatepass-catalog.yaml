# Network policies of the namespace gatepass-catalog: catalog API (PostgreSQL by IAM token, Valkey, S3 presign, EventBridge).
#
# Same model as gatepass-skeleton.yaml (read its header first): default deny, then exactly the
# paths this service needs. They live in the platform repository path and not in the service's
# chart because the `apps` project may not create NetworkPolicy objects: a bad pull request to a
# service must not be able to open the door for itself.
#
# OPEN HERE:
#   ingress 8080 from the ALB subnets; egress DNS, OTLP, Pod Identity agent, HTTPS to AWS and Cognito,
#   5432 to the data subnets (RDS), 6379 to the data subnets (Valkey); same-namespace 8080 (smoke test).
# NOT open: the internet except HTTPS, other namespaces, the data subnets except the port above.
# kubelet probes come from the node and need no rule. Related: cluster-config/namespace-gatepass-catalog.yaml,
# apps/catalog/values.yaml, walkthrough 10.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-egress
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-egress
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # The Pod Identity agent on the node hands out the role credentials.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # AWS APIs and the public Cognito key set: HTTPS to anywhere EXCEPT the VPC itself, so this rule
    # cannot be used to reach other pods or the data subnets.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-http
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-ingress
  namespace: gatepass-catalog
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: catalog}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.20.0.0/24}
        - ipBlock: {cidr: 10.20.1.0/24}
        - ipBlock: {cidr: 10.20.2.0/24}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rds-egress
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.20.100.0/24}
        - ipBlock: {cidr: 10.20.101.0/24}
        - ipBlock: {cidr: 10.20.102.0/24}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-egress
  namespace: gatepass-catalog
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.20.100.0/24}
        - ipBlock: {cidr: 10.20.101.0/24}
        - ipBlock: {cidr: 10.20.102.0/24}
      ports:
        - {protocol: TCP, port: 6379}
