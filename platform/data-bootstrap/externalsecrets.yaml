# The inputs of the bootstrap Job that are not secret in the AWS sense but must not be in a public
# repository: where the database is, and the two passwords to give the password roles. Copied from
# Secrets Manager by External Secrets (it may read only gatepass/dev/app/).
#
#   database-config   the database host and the ARN of the master secret. The ARN is passed to the Job
#                     as plain text; the Job's OWN Pod Identity role (50-workloads, data-bootstrap)
#                     may read exactly that secret: External Secrets cannot (the master secret is not
#                     under its prefix, deliberately).
#   orders-passwords  the passwords of orders_app and orders_migrator generated by 40-data.
#
# ISOLATED from the other applications on purpose: a missing Secrets Manager entry shows up here as a
# degraded ExternalSecret and nowhere else (see bootstrap/data-bootstrap.yaml for the sync wave).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-config
  namespace: data-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target: {name: database-config}
  data:
    - {secretKey: PGHOST, remoteRef: {key: gatepass/dev/app/database-config, property: db_host}}
    - {secretKey: MASTER_SECRET_ARN, remoteRef: {key: gatepass/dev/app/database-config, property: db_master_secret_arn}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-passwords
  namespace: data-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target: {name: orders-passwords}
  data:
    - {secretKey: APP_PW, remoteRef: {key: gatepass/dev/app/orders-app-db, property: password}}
    - {secretKey: MIGRATOR_PW, remoteRef: {key: gatepass/dev/app/orders-migrator-db, property: password}}
