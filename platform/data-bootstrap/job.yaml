# THE DATABASE BOOTSTRAP JOB: after every rebuild of the database (it comes up EMPTY) this creates the
# two databases, the roles and the grants, so that the services can sign in and run their migrations.
#
# TWO CONTAINERS, ONE JOB
#   init container `fetch` (the AWS CLI image)  reads the master user's password from the secret that
#       RDS manages (the pod's Pod Identity role may read exactly that secret), and downloads the RDS
#       certificate bundle, into a scratch volume.
#   container `psql` (the PostgreSQL image)      connects as the master user with TLS and full
#       verification of the server name, and runs the SQL of configmap.yaml with the two role passwords
#       passed as variables. Nothing secret is on a command line: the master password is a file read
#       into PGPASSWORD inside the shell, the others come from environment variables.
# Both images are pinned by digest (they come from the public ECR mirror). They run as a non-root user
# with a read-only root filesystem, no capabilities, and the default seccomp profile.
#
# WHEN IT RUNS. As a `Sync` hook of its Argo CD application: Argo CD deletes the old Job (hook delete
# policy BeforeHookCreation) and runs a new one whenever the application syncs, which the daily
# rebuild does. The SQL is idempotent, so a repeat is harmless. If the database is not ready yet the
# Job fails and retries (backoffLimit); `scripts/post-up.sh` and the application's retry cover the rest.
#
# UNVERIFIED until the first cluster run: that both images start as the non-root users below with
# these mounts; the master secret's JSON shape ({"username":...,"password":...}) parsing with sed
# (RDS-generated passwords contain no quote or backslash; if one ever does, switch the init container
# to an image that has jq).
#
# Related: platform/data-bootstrap/configmap.yaml (the SQL), externalsecrets.yaml,
# gatepass-infra/50-workloads (the role of the service account `data-bootstrap`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-bootstrap
  namespace: data-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-bootstrap
  namespace: data-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: data-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # the postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists}
      initContainers:
        - name: fetch
          # AWS CLI v2 from the public ECR mirror, pinned by digest.
          image: public.ecr.aws/aws-cli/aws-cli@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42
          envFrom:
            - secretRef: {name: database-config}
          env:
            - {name: HOME, value: /work}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              aws secretsmanager get-secret-value --secret-id "$MASTER_SECRET_ARN" \
                --query SecretString --output text > /work/master.json
              sed -n 's/.*"password":"\([^"]*\)".*/\1/p' /work/master.json > /work/password
              rm -f /work/master.json
              test -s /work/password
              curl -fsS -o /work/ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
      containers:
        - name: psql
          # PostgreSQL 17 client from the public ECR mirror, pinned by digest.
          image: public.ecr.aws/docker/library/postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          envFrom:
            - secretRef: {name: database-config}
            - secretRef: {name: orders-passwords}
          env:
            - {name: PGUSER, value: gatepass_admin}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /work/ca.pem}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /work/password)"
              psql -v ON_ERROR_STOP=1 -v app_pw="$APP_PW" -v migrator_pw="$MIGRATOR_PW" -f /sql/bootstrap.sql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work, readOnly: true}
            - {name: sql, mountPath: /sql, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: sql
          configMap: {name: data-bootstrap-sql}
