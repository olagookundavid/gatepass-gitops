# Values for the aws-load-balancer-controller chart 3.6.2 (applied by
# bootstrap/aws-load-balancer-controller.yaml). Only what differs from the chart's defaults.
#
# Names here MUST equal gatepass-infra/30-platform-aws/pod-identity.tf: namespace kube-system
# (the Application's destination) and service account `aws-load-balancer-controller`.

clusterName: gatepass-dev
region: us-east-1

# The controller normally asks the node's metadata service which VPC it is in. Our nodes allow
# only ONE network hop to that service (http_put_response_hop_limit = 1 in 20-cluster/nodes.tf,
# the secure setting), so a pod cannot reach it. A VPC id would fix that but changes every
# time `make up` rebuilds the VPC; the tag does not (10-network tags the VPC Name=gatepass-dev).
vpcTags:
  Name: gatepass-dev

# Two copies, on the two system nodes (the chart spreads them). The chart tolerates nothing by
# default, and the system nodes are tainted CriticalAddonsOnly.
replicaCount: 2
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

serviceAccount:
  create: true
  name: aws-load-balancer-controller

# The IngressClass `alb` and its parameters (shared load balancer, WAF by name) are in
# platform/cluster-config/ingressclass-alb.yaml, where they are reviewed with the other cluster
# policy, not generated by the chart.
createIngressClassResource: false
ingressClassParams:
  create: false

# The controller can also rewrite every Service of type LoadBalancer. We use Ingress only. The
# webhook that does the rewriting sits in the path of EVERY Service created in the cluster: if
# its pods are not ready yet, Service creation fails cluster-wide, which is a well-known way
# to break an Argo CD sync. Off = one less thing that can fail.
enableServiceMutatorWebhook: false

# Tags the controller puts on everything it creates in AWS (on top of its own ones), so the bill
# and the console group them with the rest of the project (the provider default_tags of
# Terraform do not reach objects created from inside the cluster).
defaultTags:
  Project: gatepass
  Environment: dev
  ManagedBy: aws-load-balancer-controller
  CostCenter: learning

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
