# Three Kubernetes Secrets, copied from AWS Secrets Manager by the External Secrets Operator.
#
#   observability-endpoints   the addresses of the metrics workspace and the log group. They are
#   (in both namespaces)      not passwords, but they contain the workspace id, and the gitops
#                             repository is public, so they are NOT written in Git: Terraform
#                             (60-observability) stores them in Secrets Manager and this copies
#                             them. Collectors and Grafana read them as environment variables.
#   grafana-admin             the Grafana admin user and password. The value was created by hand
#                             once (walkthrough 06 step B) and never printed.
#
# Wave 1: after the namespaces (wave 0). The ClusterSecretStore is delivered by cluster-config; if
# it is not there yet the ExternalSecret retries until it is.
#
# Related: platform/otel-*/values.yaml and platform/grafana/values.yaml (they read these Secrets),
# gatepass-infra/60-observability (writes the endpoints), platform/cluster-config/secretstore-aws.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-endpoints
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target: {name: observability-endpoints}
  data:
    - {secretKey: AMP_REMOTE_WRITE_URL, remoteRef: {key: gatepass/dev/app/observability-endpoints, property: amp_remote_write_url}}
    - {secretKey: AMP_QUERY_URL, remoteRef: {key: gatepass/dev/app/observability-endpoints, property: amp_query_url}}
    - {secretKey: LOG_GROUP, remoteRef: {key: gatepass/dev/app/observability-endpoints, property: application_log_group}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-endpoints
  namespace: observability-node
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target: {name: observability-endpoints}
  data:
    - {secretKey: AMP_REMOTE_WRITE_URL, remoteRef: {key: gatepass/dev/app/observability-endpoints, property: amp_remote_write_url}}
    - {secretKey: LOG_GROUP, remoteRef: {key: gatepass/dev/app/observability-endpoints, property: application_log_group}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target: {name: grafana-admin}
  data:
    - {secretKey: admin-user, remoteRef: {key: gatepass/dev/app/grafana-admin, property: user}}
    - {secretKey: admin-password, remoteRef: {key: gatepass/dev/app/grafana-admin, property: password}}
---
# Grafana "Sign in with GitHub": client id, client secret and the public address, from Secrets Manager
# (gatepass/dev/app/grafana-oauth, written by gatepass-infra/scripts/store-grafana-oauth.sh). They become
# environment variables of the Grafana pod; GF_AUTH_GITHUB_ENABLED=true here is what switches the login
# on (the ini in platform/grafana/values.yaml keeps it off). Moved here from examples/ once the secret
# existed, together with the ingress (walkthrough 08 step K).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target:
    name: grafana-oauth
    template:
      data:
        GF_AUTH_GITHUB_ENABLED: "true"
        GF_AUTH_GITHUB_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GITHUB_CLIENT_SECRET: "{{ .client_secret }}"
        GF_SERVER_ROOT_URL: "{{ .root_url }}"
  data:
    - {secretKey: client_id, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: client_id}}
    - {secretKey: client_secret, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: client_secret}}
    - {secretKey: root_url, remoteRef: {key: gatepass/dev/app/grafana-oauth, property: root_url}}
