# The first object Argo CD delivers: a namespace with nothing in it.
#
# It proves the whole loop (Git -> Argo CD -> cluster) without any risk, and it shows what every
# real namespace will carry from now on: the Pod Security labels.
#   enforce = restricted   the API server REJECTS any pod here that is not run as non-root, with
#                          privilege escalation off, all capabilities dropped and the default
#                          seccomp profile. This is Kubernetes' strictest built-in profile.
#   audit / warn           the same checks also report, so a rejected deployment says why.
# Argo CD's own namespace is looser (baseline), because it was not written by us; ours are
# written to pass "restricted" from day one.
#
# Related: bootstrap/cluster-config.yaml (the Application that applies this folder).
apiVersion: v1
kind: Namespace
metadata:
  name: Smoke-Bad-2
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/managed-by: argocd
