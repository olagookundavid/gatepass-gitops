# Namespace gatepass-orders: where the three orders applications: the API (orders), the payment worker (orders-worker) and the outbox relay (orders-outbox-relay) run (one namespace per SERVICE, decision 2026-11-10; before that
# every deployable had its own).
#
# Created HERE (platform project, cluster-config) and not by the service's own Applications, because the
# `apps` AppProject may not create cluster-scoped objects (projects/apps.yaml: clusterResourceWhitelist
# is empty). The services ApplicationSet puts every application of the service here (namespace =
# gatepass- + the directory name up to its first dash). What still separates the deployables inside it:
# their own service account and AWS role (Pod Identity binds role to namespace AND service account),
# their own Deployment, and NetworkPolicies that select pods by label where the rules differ.
# Same pod-security labels as namespace-gatepass-catalog.yaml (read its header).
# Related: platform/network-policies/gatepass-orders.yaml, platform/services/applicationset.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: gatepass-orders
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/managed-by: argocd
    gatepass.dev/workloads: "true"
