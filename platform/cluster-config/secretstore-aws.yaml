# ClusterSecretStore "aws-secretsmanager": the cluster-wide connection from the External
# Secrets Operator to AWS Secrets Manager. An ExternalSecret in any namespace says "copy secret
# gatepass/dev/app/<name> into a Kubernetes Secret" by naming this store; nothing about
# credentials is in the ExternalSecret.
#
# NO CREDENTIALS HERE, on purpose. With no `auth` block the operator uses the standard AWS
# credential chain, which inside its pod finds the EKS Pod Identity credentials of the role
# gatepass-dev-external-secrets (gatepass-infra/30-platform-aws/external-secrets.tf). That
# role can read only secrets whose name starts with gatepass/dev/app/. Nothing in this file is
# secret and nothing could be, because the repository is public.
#
# CLUSTER-wide store = any namespace may use it. Production usually makes one namespaced
# SecretStore per team so that team A cannot ask for team B's secret; here the IAM prefix is the
# fence, and Kyverno (Phase 6) restricts which ExternalSecret keys a namespace may request.
#
# Check it: `kubectl get clustersecretstore` must say STATUS Valid, READY True (UNVERIFIED
# until the first sync; if it says AccessDenied or NoCredentialProviders the Pod Identity
# association or the service account name differs, see the walkthrough's problems table).
#
# Related: bootstrap/external-secrets.yaml (installs the operator and its CRDs: this file is
# applied later, wave 10, so the kind exists), gatepass-infra/30-platform-aws/external-secrets.tf.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
