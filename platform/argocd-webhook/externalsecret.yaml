# The shared secret of the GitHub webhook that tells Argo CD "there is a new commit", copied from
# AWS Secrets Manager into Argo CD's own Secret.
#
# WHY A WEBHOOK. Without one Argo CD asks Git for news every 3 minutes (timeout.reconciliation in
# platform/argocd/values.yaml), so a merged pull request reaches the cluster after up to 3 minutes.
# With a webhook GitHub calls https://argocd.<domain>/api/webhook the moment someone pushes and
# Argo CD refreshes at once; the polling stays as the fallback. The call is signed with a shared
# secret, so only GitHub can trigger it (an unsigned or wrongly signed call is rejected).
#
# HOW THE SECRET GETS IN WITHOUT BEING IN GIT OR TERRAFORM STATE. Argo CD reads the key
# `webhook.github.secret` from its Secret `argocd-secret`. That Secret belongs to the Argo CD chart
# (and already has other keys that Argo CD writes itself, see ignoreDifferences in
# bootstrap/platform-argocd.yaml). `creationPolicy: Merge` makes External Secrets ADD this one key
# to the existing Secret instead of creating its own. The value is read from Secrets Manager, where
# the coach put a random string (and the same string is the secret of the GitHub webhook).
#
# ISOLATED ON PURPOSE: this lives in its own Application at the last sync wave
# (bootstrap/argocd-webhook.yaml). If the Secrets Manager entry were missing the ExternalSecret
# would report an error and the Application would show Degraded; a Degraded application stops the
# sync waves AFTER it, so it must not sit in an application that other things wait for.
#
# UNVERIFIED until a cluster run: that Argo CD picks the merged key up without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secretsmanager}
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: webhook.github.secret
      remoteRef: {key: gatepass/dev/app/argocd-webhook, property: secret}
