# The reservations API (public holds API + the private internal API for `orders`). Human-owned
# settings; the image pin is apps/reservations/dev.yaml, written by the release workflow.
#
# THE SERVICE: inventory and holds in DynamoDB. A hold is a 3-item transaction (ticket count,
# hold record with a TTL, idempotency record); it schedules an EventBridge Scheduler one-time
# schedule that invokes the hold-expirer Lambda (layer 40) when the hold runs out. Contract:
# gatepass-app/contracts/reservations-api.yaml.
#
# ONE IMAGE, TWO APPLICATIONS. The same image runs the API (here) and the SQS inventory consumer
# (apps/reservations-consumer, API switched off). Two applications so they scale and fail apart:
# a flood of messages must not slow down the API, and a deploy of one is independent of the other.
# They share the namespace gatepass-reservations (one namespace per service) but each has its own
# service account and AWS role (50-workloads/roles.tf).
#
# internalService: the PRIVATE listener (8081) gets its own Service and no Ingress rule; only the
# orders API pods may reach it (NetworkPolicy allow-internal-api-from-orders).
# Related: platform/network-policies/gatepass-reservations.yaml, apps/reservations-consumer.
image:
  repository: gatepass/reservations-api
basePath: /reservations
port: 8080
replicaCount: 2
internalService:
  enabled: true
  port: 8081
env:
  LOG_LEVEL: info
  AWS_REGION: us-east-1
  API_ENABLED: "true"
  CONSUMER_ENABLED: "false"
  INTERNAL_HTTP_ADDR: ":8081"
  HOLD_TTL: 10m
  RATE_LIMIT_PER_MINUTE: "10"
  REDIS_IAM_AUTH: "true"
  REDIS_SERVERLESS: "true"
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}
externalSecret:
  enabled: true
  data:
    - {secretKey: TABLE_NAME, key: gatepass/dev/app/data-config, property: reservations_table}
    - {secretKey: COGNITO_ISSUER, key: gatepass/dev/app/data-config, property: cognito_issuer}
    - {secretKey: COGNITO_CLIENT_ID, key: gatepass/dev/app/data-config, property: cognito_client_id}
    - {secretKey: SCHEDULER_GROUP_NAME, key: gatepass/dev/app/data-config, property: scheduler_group_name}
    - {secretKey: SCHEDULER_ROLE_ARN, key: gatepass/dev/app/data-config, property: scheduler_role_arn}
    - {secretKey: EXPIRER_LAMBDA_ARN, key: gatepass/dev/app/data-config, property: expirer_lambda_arn}
    - {secretKey: REDIS_ADDR, key: gatepass/dev/app/database-config, property: redis_addr}
    - {secretKey: CACHE_NAME, key: gatepass/dev/app/database-config, property: cache_name}
    - {secretKey: REDIS_USER, key: gatepass/dev/app/database-config, property: redis_user_reservations}
ingress:
  enabled: true
smokeTest:
  enabled: true
  path: /readyz

# --- SCALING AND DISRUPTION (Phase 9, walkthrough 12) ---------------------------------------------
# HPA on CPU: 2 replicas is the floor (one per zone is the point of the hard zone spread), 6 the ceiling
# (cost and database connections: each pod opens up to DB_MAX_CONNS). The chart then writes no `replicas`
# (otherwise Argo CD and the HPA fight). Hard zone spread: losing an availability zone must not take a
# service down. preStop + grace period: the pod keeps serving 10 s after it was taken off the load
# balancer, then the service's own SHUTDOWN_DELAY (5 s) and drain fit inside 45 s.
# APIs have NO Spot toleration: they stay on the on-demand pool (the baseline).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
topologySpread:
  zone: DoNotSchedule
preStopSleepSeconds: 10
terminationGracePeriodSeconds: 45
