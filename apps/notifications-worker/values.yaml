# The notifications WORKER: reads the queue `notifications` (EventBridge rules deliver OrderPaid,
# PaymentFailed and OrderCancelled to it), and for each event: looks the buyer's e-mail address up in
# Cognito, renders a ticket PNG with a QR code to S3 (OrderPaid only), sends the mail with SES, and
# writes a log item. Duplicates are ignored through a marker item per eventId (TTL), so a redelivered
# message sends no second mail. Human-owned settings; the pin is apps/notifications-worker/dev.yaml.
#
# THE SIGNING KEY is the one real secret here. It reaches the pod as a FILE, not an environment
# variable: `secretFiles` below makes the chart create a second ExternalSecret (<release>-files) and
# mount it at /var/run/secrets/ticket, so the service reads /var/run/secrets/ticket/signing-key
# (TICKET_SIGNING_KEY_FILE). The secret itself is made by 40-data/ticket-key.tf (random, write-only,
# never in state). Rotating it invalidates tickets already issued.
#
# SES SANDBOX: the account may only send to verified addresses, so EMAIL_RECIPIENT_OVERRIDE sends every
# mail to ONE verified address (kept in Secrets Manager, not here: it is a personal address and this
# repository is public). When SES production access is granted, remove that row.
# No route (ingress off); probes at the ROOT, hence `basePath: ""`. KEDA scaling on the queue: Phase 9.
# Related: apps/notifications, platform/network-policies/gatepass-notifications.yaml (namespace gatepass-notifications, shared with the API).
image:
  repository: gatepass/notifications-worker
basePath: ""
port: 8080
replicaCount: 2
env:
  LOG_LEVEL: info
  AWS_REGION: us-east-1
  WORKER_CONCURRENCY: "4"
  CONSUMER_VISIBILITY_TIMEOUT: 60s
  TICKET_LINK_TTL: 24h
  TICKET_SIGNING_KEY_FILE: /var/run/secrets/ticket/signing-key
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}
externalSecret:
  enabled: true
  data:
    - {secretKey: TABLE_NAME, key: gatepass/dev/app/data-config, property: notifications_table}
    - {secretKey: TICKETS_BUCKET, key: gatepass/dev/app/data-config, property: tickets_bucket}
    - {secretKey: NOTIFICATIONS_QUEUE_URL, key: gatepass/dev/app/data-config, property: notifications_queue_url}
    - {secretKey: COGNITO_USER_POOL_ID, key: gatepass/dev/app/data-config, property: cognito_user_pool_id}
    - {secretKey: SES_FROM_ADDRESS, key: gatepass/dev/app/data-config, property: ses_from_address}
    - {secretKey: SES_CONFIGURATION_SET, key: gatepass/dev/app/data-config, property: ses_configuration_set}
    - {secretKey: EMAIL_RECIPIENT_OVERRIDE, key: gatepass/dev/app/data-config, property: ses_recipient_override}
secretFiles:
  enabled: true
  mountPath: /var/run/secrets/ticket
  data:
    - {fileName: signing-key, key: gatepass/dev/app/ticket-signing-key}
ingress:
  enabled: false
# No smoke test: the worker scales to ZERO, and the PostSync test calls the pod's /readyz; with no pod it would
# fail every deploy made while the queue is empty. Readiness is still checked by the probes and by Argo CD's health.
smokeTest:
  enabled: false
  path: /readyz

# --- SCALING AND DISRUPTION (Phase 9, walkthrough 12) ---------------------------------------------
# KEDA scales this Deployment on the length of the queue (messages waiting + in flight, 5 per replica),
# between 0 and 4 replicas. KEDA reads SQS with the identity of ITS OWN operator pod
# (ClusterTriggerAuthentication keda-aws-operator); the queue URL is read from this pod's environment
# variable NOTIFICATIONS_QUEUE_URL, so it is not written in Git. Messages are retried, so an interrupted pod loses nothing.
# SPOT: the worker may run on the tainted Spot pool and PREFERS it (cheaper); if no Spot node exists it
# runs on-demand. PDB: maxUnavailable 1, because minAvailable 1 on a single replica would make a node
# drain wait forever.
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURLFromEnv: NOTIFICATIONS_QUEUE_URL
        queueLength: "5"
        awsRegion: us-east-1
tolerations:
  - {key: gatepass.dev/spot, operator: Equal, value: "true", effect: NoSchedule}
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
pdb:
  maxUnavailable: 1
# MIN 0: with an empty queue there is no pod at all (no cost); the first message waits for KEDA's next poll (15 s) and
# a pod start (about 20 s). Used where a short delay is invisible (mail); the payment worker and the inventory consumer keep 1.
