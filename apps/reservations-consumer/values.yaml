# The reservations INVENTORY CONSUMER: the same image as apps/reservations, with the HTTP API
# switched off and the SQS consumer switched on. Human-owned settings; the image pin is
# apps/reservations-consumer/dev.yaml (written by the release workflow together with
# apps/reservations/dev.yaml, so both always run the same digest).
#
# WHAT IT DOES: reads the queue `reservations-inventory` (fed by EventBridge rules: EventPublished
# creates the inventory, PaymentFailed and OrderCancelled give tickets back), and applies each
# message to DynamoDB idempotently. A message that fails 5 times lands in the DLQ (alarm in
# layer 40). It has NO route at all (ingress off): it only makes outbound calls; the probes are
# answered on the pod's own port for kubelet.
#
# Related: apps/reservations (the API), 50-workloads/roles.tf (role reservations-consumer),
# platform/network-policies/gatepass-reservations.yaml (namespace gatepass-reservations, shared with the API). Scaling on queue depth with KEDA
# comes in Phase 9 (the contract's scaling_hint names the queue).
image:
  repository: gatepass/reservations-api
basePath: /reservations
port: 8080
replicaCount: 2
env:
  LOG_LEVEL: info
  AWS_REGION: us-east-1
  API_ENABLED: "false"
  CONSUMER_ENABLED: "true"
  CONSUMER_WORKERS: "4"
  CONSUMER_VISIBILITY_TIMEOUT: 60s
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}
externalSecret:
  enabled: true
  data:
    - {secretKey: TABLE_NAME, key: gatepass/dev/app/data-config, property: reservations_table}
    - {secretKey: INVENTORY_QUEUE_URL, key: gatepass/dev/app/data-config, property: inventory_queue_url}
ingress:
  enabled: false
smokeTest:
  enabled: true
  path: /readyz

# --- SCALING AND DISRUPTION (Phase 9, walkthrough 12) ---------------------------------------------
# KEDA scales this Deployment on the length of the queue (messages waiting + in flight, 10 per replica),
# between 1 and 4 replicas. KEDA reads SQS with the identity of ITS OWN operator pod
# (ClusterTriggerAuthentication keda-aws-operator); the queue URL is read from this pod's environment
# variable INVENTORY_QUEUE_URL, so it is not written in Git. Messages are retried, so an interrupted pod loses nothing.
# SPOT: the worker may run on the tainted Spot pool and PREFERS it (cheaper); if no Spot node exists it
# runs on-demand. PDB: maxUnavailable 1, because minAvailable 1 on a single replica would make a node
# drain wait forever.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURLFromEnv: INVENTORY_QUEUE_URL
        queueLength: "10"
        awsRegion: us-east-1
tolerations:
  - {key: gatepass.dev/spot, operator: Equal, value: "true", effect: NoSchedule}
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
pdb:
  maxUnavailable: 1
